# Serviços do SGP-P&D (base para homologação e produção).
# Desenvolvimento: docker-compose.override.yml é carregado automaticamente.
# Homologação/produção: docker compose -f docker-compose.yml up -d
name: sgp-pd

x-app: &app
  image: sgp-pd:latest
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
    target: runtime
  env_file: .env
  environment:
    DB_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/var/media
  restart: unless-stopped

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-sgp}
      POSTGRES_USER: ${DB_OWNER_USER:-sgp_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD no .env}
      APP_DB_USER: ${DB_USER:-sgp_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      web:
        condition: service_healthy

  nginx:
    build:
      context: deploy/nginx
    image: sgp-pd-nginx:latest
    environment:
      HTTPS_PUBLIC_PORT: ${HTTPS_PORT:-443}
      SGP_CERT_CN: ${SGP_CERT_CN:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
