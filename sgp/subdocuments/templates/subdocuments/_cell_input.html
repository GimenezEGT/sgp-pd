{% if cell.column.type == "vocabulary" %}<select name="{{ cell.name }}"><option value="">—</option>{% for choice in cell.column.choices %}<option value="{{ choice.value }}"{% if choice.value == cell.input %} selected{% endif %}>{{ choice.label }}</option>{% endfor %}</select>{% elif cell.column.type == "date" %}<input type="date" name="{{ cell.name }}" value="{{ cell.input }}">{% else %}<input type="text" name="{{ cell.name }}" value="{{ cell.input }}"{% if cell.column.type == "reference" %} placeholder="código"{% endif %}>{% endif %}
