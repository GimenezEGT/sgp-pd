# Desenvolvimento: LDAP fictício, código montado e servidor com recarga automática.
services:
  web:
    image: sgp-pd:dev
    build:
      target: dev
    command: ["web-dev"]
    environment:
      DJANGO_DEBUG: "true"
      # Certificado autoassinado de teste para o selo (gerado por `manage.py selo_teste`).
      DOCUMENT_SEAL_PKCS12: /app/var/certs/selo-teste.p12
      DOCUMENT_SEAL_PASSWORD: ${DOCUMENT_SEAL_DEV_PASSWORD:-selo-teste-dev-ficticio}
      # E-mails do desenvolvimento em arquivos (var/emails), sem SMTP.
      EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      CACHE_URL: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      ldap:
        condition: service_started

  worker:
    image: sgp-pd:dev
    build:
      target: dev
    environment:
      DOCUMENT_SEAL_PKCS12: /app/var/certs/selo-teste.p12
      DOCUMENT_SEAL_PASSWORD: ${DOCUMENT_SEAL_DEV_PASSWORD:-selo-teste-dev-ficticio}
      EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      CACHE_URL: redis://redis:6379/1
    volumes:
      - .:/app

  ldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service", "--loglevel", "warning"]
    # Volta sozinho quando o Docker reinicia, como os demais serviços (sem ele ninguém entra).
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Empresa ficticia (dev)"
      LDAP_DOMAIN: "sgp.dev.local"
      LDAP_ADMIN_PASSWORD: ${LDAP_DEV_ADMIN_PASSWORD:-admin-dev-ficticio}
    volumes:
      - ./deploy/ldap-dev/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    ports:
      # Porta do LDAP fictício no computador (só para consulta com ferramentas de LDAP).
      - "${LDAP_DEV_PORT:-3890}:389"
